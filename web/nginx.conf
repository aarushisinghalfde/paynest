server {
  listen 80;

  # /api/* goes to the API container; the prefix is stripped.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;     # WebSockets (phase 5)
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Single-page app: /chat and /review both serve index.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
