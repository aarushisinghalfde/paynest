# The router: plain rules, first match wins (build plan section 2: "routed by code").
# Each rule names the facts it needs; `reason` is what the reviewer and the trace show.
# Routes: block, incident, duplicate, review (draft + human approval), reply (auto), queue,
# chat (greeting/thanks: conversational reply), ask (one clarifying question).
rules:
  - id: R01-injection
    when: {injection: true}
    route: block
    reason: "possible prompt injection ({injection_rules}): no model reply, human only"
  - id: R02-pii-quarantine
    when: {pii_blocked: true}
    route: block
    reason: "PII re-scan quarantined the ticket"
  - id: R03a-smalltalk
    when: {smalltalk: true}
    route: chat
    reason: "greeting, thanks or an update request: conversational reply, nothing to route"
  - id: R03b-too-vague
    when: {vague: true}
    route: ask
    reason: "too little detail to route: one clarifying question first"
  - id: R03-unknown-tenant
    when: {tenant_known: false}
    route: queue
    queue: Triage-Desk
    reason: "unknown tenant: triage desk"
  - id: R04-incident
    when: {incident: true}
    route: incident
    reason: "part of an open incident ({incident_size} similar tickets): incident update"
  - id: R05-duplicate
    when: {duplicate: true}
    route: duplicate
    reason: "duplicate of {duplicate_of} ({duplicate_reason}): linked, no second reply"
  - id: R06-known-issue
    when: {jira: true}
    route: review
    reason: "matches Jira {jira_key}: reply with the known-issue status, after review"
  # ---- Risk policy (config/risk.yaml): requests to DO something with money or personal data. The agent
  # tells the customer exactly what happens next and hands the ticket to the right person; it never acts.
  - id: R06a-legal
    when: {legal: true}
    route: queue
    queue: Support-Lead
    reply: legal
    reason: "legal or regulatory complaint: the support lead replies personally"
  - id: R06b-money-second-approver
    when: {money: true, second_approver: true}
    route: queue
    queue: Finance-Approvals
    reply: money_high
    reason: "{money_kind} of {amount} (at or above {limit}): a payroll specialist and a finance lead approve; the agent never moves money"
  - id: R06d-money
    when: {money: true, pay_at_risk: false}
    route: queue
    queue: Payroll-L2
    reply: money
    reason: "{money_kind}{amount_text}: a payroll specialist approves; the agent never moves money"
  - id: R06e-private-data
    when: {private: true}
    route: queue
    queue: Privacy-Desk
    reply: private
    reason: "personal data request ({private_kind}): the privacy desk handles it, the model never does"
  - id: R07-statutory
    when: {team: Statutory}
    route: review
    reason: "statutory answer: drafted, human approval required"
  - id: R08-p1
    when: {priority_signal: true}
    route: review
    reason: "P1 signal (payroll cannot run / pay or filing at risk): human approval"
  - id: R08b-pay-at-risk
    # after statutory (a WPS/SIF rejection gets a drafted fix a person approves) and P1 (model signal)
    when: {pay_at_risk: true}
    route: queue
    queue: Payroll-L2
    reply: money
    reason: "P1, pay at risk ({money_kind}): a payroll specialist checks the payment now"
  - id: R09-clarify
    when: {branch: clarify}
    route: queue
    queue: Payroll-Statutory-Pod
    reason: "{team} vs {second} too close: joint pod"
  - id: R10-low-confidence
    when: {branch: triage}
    route: queue
    queue: Triage-Desk
    reason: "low classification confidence: triage desk"
  - id: R11-howto
    when: {team: How-To}
    route: reply
    reason: "How-To with clear classification: answered from approved sources"
  - id: R99-default
    when: {}
    route: reply
    reason: "{team}: acknowledged automatically, owner queue {team}"
