# Model ladder (cheapest rung first). Phase 0 outcome: Bedrock model calls are on hold
# for this account, so OpenRouter is the stand-in provider. The model client that reads
# this file is built in phase 6; switching to Bedrock is the `provider` line.
provider: openrouter

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    ladder:                          # check IDs and prices at openrouter.ai/models
      - meta-llama/llama-3.1-8b-instruct
      - google/gemini-2.5-flash
  bedrock:
    region: ap-southeast-2
    # Amazon Nova through the APAC inference profiles (no Anthropic form needed). Not callable on
    # this account yet ("Operation not allowed" on every model, 22 Nov): scripts/check_bedrock.py
    # shows when it is. Claude Haiku (au.anthropic.claude-haiku-4-5-20251001-v1:0) can replace
    # rung 1 once the Anthropic use-case form is accepted.
    ladder:
      - apac.amazon.nova-micro-v1:0
      - apac.amazon.nova-pro-v1:0
    prices:                          # USD per 1,000 tokens; check the AWS price list for ap-southeast-2
      apac.amazon.nova-micro-v1:0: {in: 0.000035, out: 0.00014}
      apac.amazon.nova-pro-v1:0: {in: 0.0008, out: 0.0032}

  agentcore:
    # Phase E: the model steps run on a Bedrock AgentCore Runtime in Sydney (agent/agentcore_app.py,
    # infra/cfn/agentcore.yaml), which calls its own backend (openrouter today, bedrock later).
    region: ap-southeast-2
    runtime_arn_env: AGENTCORE_RUNTIME_ARN
    ladder: []

budget:
  daily_usd_cap: 0.50

# Default rung per job, set from the model-fit test (scripts/model_fit.py) and the
# faithfulness eval (phase 8). One retry goes one rung up.
defaults:
  classify: 0
  draft: 1
  # Auto-route when the classifier's confidence is at least this. Q3 check (latest 20% of tickets,
  # trained on the earlier 80%): 0.6 -> 145/271 auto-routed at 99.3%; 0.5 -> 260/271 at 95.9%
  # overall, the same accuracy as today's triage outcome, with ~1/10 of the triage-desk load.
  classify_auto_at: 0.5
  # Send an agent-written answer to the customer with no person only at this confidence AND when the
  # classifier layers agree. 0.5 is fine for picking a team queue (a wrong queue is re-routed); it is
  # not enough to answer a customer. Below this the answer waits for a person's approval.
  answer_auto_at: 0.8
