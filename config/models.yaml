# Model ladder (cheapest rung first). Phase 0 outcome: Bedrock model calls are on hold
# for this account, so OpenRouter is the stand-in provider. The model client that reads
# this file is built in phase 6; switching to Bedrock is the `provider` line.
provider: openrouter

providers:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    ladder:                          # check IDs and prices at openrouter.ai/models
      - meta-llama/llama-3.1-8b-instruct
      - google/gemini-2.5-flash
  bedrock:
    region: ap-southeast-2
    ladder: []                       # fill in after re-running phase0_checks.py once AWS lifts the hold

budget:
  daily_usd_cap: 0.50

# Default rung per job, set from the model-fit test (scripts/model_fit.py) and the
# faithfulness eval (phase 8). One retry goes one rung up.
defaults:
  classify: 0
  draft: 1
  # Auto-route when the classifier's confidence is at least this. Q3 check (latest 20% of tickets,
  # trained on the earlier 80%): 0.6 -> 145/271 auto-routed at 99.3%; 0.5 -> 260/271 at 95.9%
  # overall, the same accuracy as today's triage outcome, with ~1/10 of the triage-desk load.
  classify_auto_at: 0.5
