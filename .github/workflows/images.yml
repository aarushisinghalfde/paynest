# Release images: test, then build "app" and "web" natively on ARM (same CPU type as the
# t4g EC2) and push them to ECR in Sydney.
#
# Runs ONLY when you approve a release by pushing a version tag:
#     git tag v0.2.0
#     git push origin v0.2.0
# or by clicking "Run workflow" on main (fallback). Ordinary pushes do not run it.
#
# Signs in to AWS through OIDC (GitHubDeployRole in infra/cfn/iam.yaml): no AWS keys in
# GitHub. One-time setup: repo variable AWS_DEPLOY_ROLE_ARN = that role's ARN.
name: Images

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  id-token: write                # needed to request the OIDC token
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  build:
    needs: test                  # no image unless the tests pass
    runs-on: ubuntu-24.04-arm    # native ARM runner: no emulation, free for public repos
    strategy:
      fail-fast: false           # one failing image does not cancel the other
      matrix:
        include:
          - image: app           # api, worker, mock payroll API
            context: .
          - image: web           # nginx + React
            context: web
    env:
      # v0.2.0 for a tag release; the commit SHA for a manual run from main
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/paynest-demo/${{ matrix.image }}:${{ env.VERSION }}
            ${{ steps.ecr.outputs.registry }}/paynest-demo/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
