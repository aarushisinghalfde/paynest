# Builds the two Docker images on GitHub's machines and pushes them to ECR in Sydney,
# only when started by hand (Actions tab > Images > Run workflow).
# Signs in to AWS through OIDC (the GitHubDeployRole from infra/cfn/iam.yaml):
# no AWS keys are stored in GitHub. Images are arm64, to match the t4g (Graviton) EC2.
#
# One-time setup: repo Settings > Secrets and variables > Actions > Variables >
#   AWS_DEPLOY_ROLE_ARN = the GitHubDeployRoleArn output of the iam stack
name: Images

on:
  # Manual only: nothing reaches AWS unless you click "Run workflow" in the Actions tab.
  workflow_dispatch: {}

permissions:
  id-token: write                # needed to request the OIDC token
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: app           # api, worker, mock payroll API
            context: .
          - image: web           # nginx + React
            context: web
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3      # lets an x86 runner build arm64 images
      - uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/paynest-demo/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/paynest-demo/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
