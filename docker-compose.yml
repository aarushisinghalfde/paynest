# Local stack for phase 1. One command starts everything:
#   docker compose up -d --build --wait
#
# Postgres runs locally. Redis (Upstash) and the queue (Amazon SQS in Sydney) are
# real cloud services, so before starting:
#   - .env holds REDIS_URL (your Upstash URL)
#   - `aws login --profile payce-fde` is current; ~/.aws is mounted into the containers
#   - the dev queues exist: python scripts/create_dev_queues.py
#
# Optional, offline: a local SQS stand-in (ElasticMQ). Set SQS_ENDPOINT_URL in .env, then
#   docker compose --profile local-queue up -d --build --wait

x-python-env: &python-env
  PAYNEST_REGION: demo
  DATABASE_URL: postgresql://paynest:paynest@postgres:5432/paynest
  REDIS_URL: ${REDIS_URL:?set REDIS_URL (Upstash) in .env}
  SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-paynest-dev-tickets-in}
  AWS_PROFILE: ${AWS_PROFILE:-payce-fde}
  # Empty = real SQS. If .env sets SQS_ENDPOINT_URL, containers use the elasticmq service.
  SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL:+http://elasticmq:9324}
  # Phase 3 PII gate. The laptop keeps vault values in the worker's memory only;
  # AWS uses VAULT_BACKEND=dynamo (DynamoDB + KMS, infra/cfn/vault.yaml).
  PII_HMAC_KEY: ${PII_HMAC_KEY:-}
  VAULT_BACKEND: ${VAULT_BACKEND:-memory}
  PII_NER: ${PII_NER:-auto}

x-aws-credentials: &aws-credentials
  # Read-write: `aws login` credentials are refreshed in ~/.aws/login/cache.
  - ~/.aws:/root/.aws

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: paynest
      POSTGRES_PASSWORD: paynest
      POSTGRES_DB: paynest
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paynest"]
      interval: 3s
      retries: 20

  elasticmq:                    # OPTIONAL local SQS stand-in; only with --profile local-queue
    image: softwaremill/elasticmq-native
    profiles: ["local-queue"]
    ports: ["9324:9324"]                # SQS-compatible API
    volumes: ["./infra/local/elasticmq.conf:/opt/elasticmq.conf:ro"]

  elasticmq-ui:                 # OPTIONAL queue browser for elasticmq; open http://localhost:9326
    image: softwaremill/elasticmq-ui
    profiles: ["local-queue"]
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
    ports: ["9326:3000"]                # 3000 inside; 9326 on your laptop (3000 is the web app)
    depends_on: [elasticmq]

  api:
    build: .
    # Migrations run first, so the API never starts against an old schema.
    command: sh -c "python scripts/migrate.py && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    environment: *python-env
    volumes: *aws-credentials
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  worker:
    build: .
    command: python -m worker.main
    environment: *python-env
    volumes: *aws-credentials
    restart: unless-stopped     # come back after a crash or a Docker restart
    depends_on:
      api: {condition: service_healthy}

  mock-payroll-api:
    build: .
    command: uvicorn app:app --app-dir mock-payroll-api --host 0.0.0.0 --port 8081
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 3s
      retries: 20

  web:
    build: ./web
    ports: ["3000:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      retries: 20

volumes:
  pgdata: {}
