# Local stack for phase 1. One command starts everything:
#   docker compose up -d --build --wait
#
# Postgres runs locally. Redis (Upstash) and the queue (Amazon SQS in Sydney) are
# real cloud services, so before starting:
#   - .env holds REDIS_URL (your Upstash URL)
#   - `aws login --profile payce-fde` is current; ~/.aws is mounted into the containers
#   - the dev queues exist: python scripts/create_dev_queues.py

x-python-env: &python-env
  PAYNEST_REGION: demo
  DATABASE_URL: postgresql://paynest:paynest@postgres:5432/paynest
  REDIS_URL: ${REDIS_URL:?set REDIS_URL (Upstash) in .env}
  SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-paynest-dev-tickets-in}
  AWS_PROFILE: ${AWS_PROFILE:-payce-fde}

x-aws-credentials: &aws-credentials
  # Read-write: `aws login` credentials are refreshed in ~/.aws/login/cache.
  - ~/.aws:/root/.aws

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: paynest
      POSTGRES_PASSWORD: paynest
      POSTGRES_DB: paynest
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paynest"]
      interval: 3s
      retries: 20

  api:
    build: .
    # Migrations run first, so the API never starts against an old schema.
    command: sh -c "python scripts/migrate.py && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    environment: *python-env
    volumes: *aws-credentials
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  worker:
    build: .
    command: python -m worker.main
    environment: *python-env
    volumes: *aws-credentials
    depends_on:
      api: {condition: service_healthy}

  mock-payroll-api:
    build: .
    command: uvicorn app:app --app-dir mock-payroll-api --host 0.0.0.0 --port 8081
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 3s
      retries: 20

  web:
    build: ./web
    ports: ["3000:80"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 3s
      retries: 20

volumes:
  pgdata: {}
