# Local SQS stand-in. Mirrors the AWS setup built in phase 2:
# tickets-in moves a message to tickets-dlq after 3 failed receives.
include classpath("application.conf")

queues {
  tickets-in {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "tickets-dlq"
      maxReceiveCount = 3
    }
  }
  tickets-dlq { }
}
