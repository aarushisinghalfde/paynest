# OPTIONAL local stand-in for Amazon SQS (offline work, no AWS sign-in).
# Same queue names and dead-letter rule as scripts/create_dev_queues.py.
# Used only with:  docker compose --profile local-queue up -d --build --wait
include classpath("application.conf")

queues {
  paynest-dev-tickets-in {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "paynest-dev-tickets-dlq"
      maxReceiveCount = 3
    }
  }
  paynest-dev-tickets-dlq { }
}
